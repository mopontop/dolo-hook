name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild release bundle
        run: python scripts/build.py

      - name: Structural check
        run: python scripts/check.py

      - name: Bundle is in sync with src
        run: git diff --exit-code -- release/ojb-test-hub.lua
